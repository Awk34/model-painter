name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Cloud Functions dependencies
        run: pnpm --dir functions install --no-frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run TypeScript typecheck
        run: pnpm run typecheck

      - name: Run rules parity and script tests
        run: |
          pnpm run test:rules
          pnpm run test:scripts

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run headless Karma unit tests
        run: |
          CHROME_EXE=$(node -e "import('playwright').then(p => console.log(p.chromium.executablePath()))")
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$CHROME_EXE" > /tmp/chrome-no-sandbox.sh
          chmod +x /tmp/chrome-no-sandbox.sh
          CHROME_BIN=/tmp/chrome-no-sandbox.sh pnpm exec ng test --watch=false --browsers=ChromeHeadless
          rm -f /tmp/chrome-no-sandbox.sh

      - name: Run Vitest browser screenshot tests
        run: pnpm run test:screenshot

      - name: Build Cloud Functions
        run: pnpm --dir functions run build

      - name: Build Angular application
        run: pnpm run build

      - name: Write optional Firebase Web Config fallback post-build
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: |
          if [ -n "$FIREBASE_WEB_CONFIG" ]; then
            printf '%s\n' "$FIREBASE_WEB_CONFIG" > dist/model-painter/browser/firebase-config.json
          fi

      - name: Deploy preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MODEL_PAINTER_A8724 }}
          projectId: model-painter-a8724
