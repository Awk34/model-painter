<app-modal-dialog
  [open]="open()"
  [title]="modalTitle()"
  size="sm"
  style="--dialog-max-width: min(480px, calc(100vw - 24px))"
  closeLabel="Close add to project dialog"
  (closed)="close()"
>
  @if (open()) {
    <div class="modal-body">
      @if (userState.projects().length > 0) {
        <div class="proj-list">
          @for (p of userState.projects(); track p.id) {
            <button
              type="button"
              class="proj-pick-btn studio-card"
              (click)="addToExistingProject(p.id)"
            >
              <strong>{{ p.name }}</strong>
              <span>{{ getActionLabel(p) }}</span>
            </button>
          }
        </div>
        <hr class="divider" />
      }

      <label class="field-label" for="new-proj-item-name">
        Or Create a New Project with This {{ itemType() === 'model' ? 'Model' : 'Color' }}:
      </label>
      <form class="create-proj-row" [formGroup]="createProjectForm" (ngSubmit)="createProjectWithItem()">
        <input
          id="new-proj-item-name"
          type="text"
          class="input-control"
          placeholder="New project name..."
          [formControl]="projectNameControl"
          autofocus
        />
        <button type="submit" class="btn btn-gold">
          Create &amp; Add
        </button>
      </form>
    </div>
  }
</app-modal-dialog>
