<section class="filters-bar studio-card">
  <ng-content select="[filterBarTop]" />

  <div class="search-input-wrap">
    <label [for]="searchId()" class="sr-only">{{ searchLabel() }}</label>
    <input
      [id]="searchId()"
      type="search"
      class="input-control"
      [placeholder]="searchPlaceholder()"
      [formControl]="searchControl"
    />
  </div>

  <div class="filter-controls">
    <label [for]="stageSelectId()" class="sr-only">Target finish stage</label>
    <select
      [id]="stageSelectId()"
      class="input-control filter-select"
      [formControl]="stageControl"
      title="Target Finish Stage for Readiness Filtering"
    >
      @for (s of stages; track s.key) {
        <option [value]="s.key">{{ s.dropdownLabel }}</option>
      }
    </select>

    <label [for]="readinessSelectId()" class="sr-only">Readiness filter</label>
    <select
      [id]="readinessSelectId()"
      class="input-control filter-select"
      [formControl]="readinessControl"
    >
      <option value="all">{{ readinessAllLabel() }}</option>
      <option value="ready100">✓ 100% Ready for Target Finish</option>
      <option [value]="missingThreshold() === 1 ? 'missing1' : 'missing2'">
        ⚡ Missing ≤ {{ missingThreshold() }} {{ missingThreshold() === 1 ? 'Paint' : 'Paints' }} for Target Finish
      </option>
      <option value="sortReady">Sort by Highest Match % (Target Finish)</option>
    </select>

    <label [for]="rangeSelectId()" class="sr-only">Paint range filter</label>
    <select
      [id]="rangeSelectId()"
      class="input-control filter-select"
      [formControl]="rangeControl"
    >
      <option value="all">All Paint Ranges</option>
      <option value="warhammer_colour">Citadel Colour (Classic)</option>
      <option value="warhammer_pro">Citadel Tone Pro</option>
    </select>
  </div>
</section>
