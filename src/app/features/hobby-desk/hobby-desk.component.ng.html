<div class="page-container">
  <app-desk-header
    icon="hobby_desk"
    title="Hobby Desk"
    subtitle="Manage your projects, paint inventory, wishlist, and cross-brand equivalents."
    (projectsClick)="openProjectsTab()"
    (modelsClick)="openModelsTab($event)"
    (paintsClick)="openPaintsTab($event)"
  />

  <nav class="subtab-bar" aria-label="Hobby desk sections">
    <button
      type="button"
      class="subtab-btn"
      [class.active]="activeTab() === 'projects'"
      [attr.aria-pressed]="activeTab() === 'projects'"
      (click)="activeTab.set('projects')"
    >
      <app-icon name="project" class="tab-ic" />
      <span>My Projects ({{ userState.projects().length }})</span>
    </button>

    <button
      type="button"
      class="subtab-btn"
      [class.active]="activeTab() === 'models'"
      [attr.aria-pressed]="activeTab() === 'models'"
      (click)="activeTab.set('models')"
    >
      <app-icon name="models" class="tab-ic" />
      <span>My Models ({{ userState.inventoryModelIds().length }} / {{ userState.wishlistModelIds().length }}★)</span>
    </button>

    <button
      type="button"
      class="subtab-btn"
      [class.active]="activeTab() === 'paints'"
      [attr.aria-pressed]="activeTab() === 'paints'"
      (click)="activeTab.set('paints')"
    >
      <app-icon name="paint" class="tab-ic" />
      <span>My Paints &amp; Catalogue</span>
    </button>

    <button
      type="button"
      class="subtab-btn"
      [class.active]="activeTab() === 'converter'"
      [attr.aria-pressed]="activeTab() === 'converter'"
      (click)="activeTab.set('converter')"
    >
      <app-icon name="compare" class="tab-ic" />
      <span>Cross-Brand Converter</span>
    </button>
  </nav>

  @switch (activeTab()) {
    @case ('projects') {
      <app-hobby-desk-projects-tab />
    }
    @case ('models') {
      <app-hobby-desk-models-tab [(subMode)]="modelSubMode" />
    }
    @case ('paints') {
      <app-hobby-desk-paints-tab [(subMode)]="paintSubMode" />
    }
    @case ('converter') {
      <app-hobby-desk-converter-tab />
    }
  }
</div>
