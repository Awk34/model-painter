<div class="tiers-list">
  @for (tierBlock of tierBlocks(); track tierBlock.key) {
    <div
      class="tier-block"
      [class.highlighted]="activeTier() === tierBlock.key"
    >
      <h2 class="tier-block-header">
        <button
          type="button"
          class="tier-block-header-btn"
          [attr.aria-pressed]="activeTier() === tierBlock.key"
          (click)="activeTier.set(tierBlock.key)"
        >
          <span class="tier-title">{{ tierBlock.label }}</span>
          <span class="tier-sub">
            {{ tierBlock.steps.length }} Step{{ tierBlock.steps.length === 1 ? '' : 's' }}
          </span>
        </button>
      </h2>

      <div class="stage-steps">
        @for (st of tierBlock.steps; track st.id) {
          @if (st.paint; as sp) {
            <div class="stage-step-row">
              <button
                type="button"
                class="step-paint-btn"
                (click)="paintModal.openPaint(sp.id)"
              >
                <span class="step-order-num">{{ st.stepOrder }}</span>
                <app-paint-swatch [paint]="sp" />
                <div class="step-paint-info">
                  <strong>{{ sp.name }}</strong>
                  <span>{{ st.technique || sp.category }}</span>
                </div>
              </button>

              <div class="step-paint-actions">
                @let sub = readiness().substitutedByPaintId[sp.id];
                @if (userState.isOwned(sp.id)) {
                  <button
                    type="button"
                    class="btn btn-sm btn-owned"
                    (click)="userState.toggleInventory(sp.id)"
                  >
                    ✓ Owned
                  </button>
                } @else if (sub) {
                  <button
                    type="button"
                    class="btn btn-sm badge-sub"
                    (click)="paintModal.openPaint(sp.id)"
                  >
                    ⇄ {{ sub.substituteName }}
                  </button>
                } @else {
                  <button
                    type="button"
                    class="btn btn-sm btn-ghost"
                    (click)="userState.toggleInventory(sp.id)"
                  >
                    + Own
                  </button>
                  <button
                    type="button"
                    class="btn btn-sm"
                    [class.btn-wishlist]="userState.isWishlisted(sp.id)"
                    [class.btn-ghost]="!userState.isWishlisted(sp.id)"
                    [attr.aria-label]="(userState.isWishlisted(sp.id) ? 'Remove from wishlist: ' : 'Add to wishlist: ') + sp.name"
                    (click)="userState.toggleWishlist(sp.id)"
                  >
                    {{ userState.isWishlisted(sp.id) ? '★' : '☆' }}
                  </button>
                }
              </div>
            </div>
          }
        }
      </div>
    </div>
  }
</div>
